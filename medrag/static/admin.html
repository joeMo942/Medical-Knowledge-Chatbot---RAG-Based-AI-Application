<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KB Documents - admin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
  table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.5rem; }
  th, td { text-align: start; padding: .4rem .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
  label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
  input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: .5rem; font-size: 1rem; }
  button { padding: .5rem 1rem; font-size: 1rem; }
  #msg { padding: .6rem .8rem; border-radius: .5rem; margin: 1rem 0; display: none; white-space: pre-wrap; }
  #msg.ok { display: block; background: #e6f4ea; } #msg.err { display: block; background: #fce8e6; }
  .small { font-size: .85rem; color: #555; }
</style>
</head>
<body>
<h1>KB Documents</h1>
<p class="small"><a href="/">Chat page</a></p>

<fieldset>
  <legend>Admin token</legend>
  <label for="token">MEDRAG_ADMIN_TOKEN (kept in this tab only, sent as a Bearer header)</label>
  <input id="token" type="password" autocomplete="off">
  <p><button id="load" type="button">Load documents</button></p>
</fieldset>

<div id="msg" role="status"></div>

<table>
  <thead><tr><th>KB ID</th><th>Title</th><th>Sections</th><th>File</th><th>Updated</th><th></th></tr></thead>
  <tbody id="docs"><tr><td colspan="6" class="small">Enter the token and load the documents.</td></tr></tbody>
</table>

<form id="up">
  <fieldset>
    <legend>Upload or replace a KB Document</legend>
    <label for="kb_id">KB ID (e.g. KB-03; an existing ID is replaced)</label>
    <input id="kb_id" type="text" pattern="KB-[0-9]{2}" required>
    <label for="file">.docx file (up to 10 MB)</label>
    <input id="file" type="file" accept=".docx" required>
    <label for="diseases">Disease headings, one per line, exactly as they appear in the file
      (required for a new KB ID; empty keeps the current ones when replacing)</label>
    <textarea id="diseases" rows="4" dir="auto"></textarea>
    <p><button type="submit">Upload</button></p>
  </fieldset>
</form>

<script>
const $ = (id) => document.getElementById(id);
const tokenBox = $("token"), msg = $("msg"), tbody = $("docs");
try { tokenBox.value = sessionStorage.getItem("medrag-admin-token") || ""; } catch (e) {}

function say(kind, text) { msg.className = kind; msg.textContent = text; }
function headers(extra) {
  try { sessionStorage.setItem("medrag-admin-token", tokenBox.value); } catch (e) {}
  return Object.assign({"Authorization": "Bearer " + tokenBox.value}, extra || {});
}
async function call(method, url, body) {
  const r = await fetch(url, {method, headers: headers(body ? {"Content-Type": "application/json"} : null),
                              body: body ? JSON.stringify(body) : undefined});
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(r.status + ": " + (data.error || r.statusText));
  return data;
}
function cell(tr, text) { const td = document.createElement("td"); td.textContent = text; td.dir = "auto"; tr.appendChild(td); return td; }

async function refresh() {
  const data = await call("GET", "/admin/documents");
  tbody.textContent = "";
  if (!data.documents.length) {
    const tr = tbody.insertRow(); const td = cell(tr, "No KB Documents: every question is Out of Scope."); td.colSpan = 6;
  }
  for (const d of data.documents) {
    const tr = tbody.insertRow();
    cell(tr, d.kb_id); cell(tr, d.title); cell(tr, String(d.sections)); cell(tr, d.file_name || "-"); cell(tr, d.updated || "-");
    const act = tr.insertCell(); const b = document.createElement("button"); b.type = "button"; b.textContent = "Delete";
    b.addEventListener("click", async () => {
      if (!confirm("Delete " + d.kb_id + " (" + d.title + ")? Its questions become Out of Scope.")) return;
      try { await call("DELETE", "/admin/documents/" + encodeURIComponent(d.kb_id)); say("ok", d.kb_id + " deleted."); await refresh(); }
      catch (err) { say("err", err.message); }
    });
    act.appendChild(b);
  }
}
$("load").addEventListener("click", async () => {
  try { await refresh(); say("", ""); msg.className = ""; } catch (err) { say("err", err.message); }
});

function toBase64(buf) {
  let s = ""; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
$("up").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $("file").files[0]; if (!file) return;
  const lines = $("diseases").value.split("\n").map((l) => l.trim()).filter(Boolean);
  const body = {kb_id: $("kb_id").value.trim(), filename: file.name, content_base64: toBase64(await file.arrayBuffer())};
  if (lines.length) body.diseases = lines;
  say("ok", "Uploading and re-indexing (a few seconds)...");
  try {
    const r = await call("POST", "/admin/documents", body);
    say("ok", r.kb_id + " saved: " + r.title + ", " + r.sections + " Sections.");
    await refresh();
  } catch (err) { say("err", err.message); }
});
if (tokenBox.value) refresh().catch((err) => say("err", err.message));
</script>
</body>
</html>
