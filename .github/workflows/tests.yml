name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # No models and no KB files: data/ is not committed, so the tests marked
      # `kb` skip themselves and the synthetic-fixture tests run.
      - name: Unit tests
        run: pytest
