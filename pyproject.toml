[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag"
version = "0.1.0"
description = "Drug-information RAG chatbot: knowledge base ingestion and serving"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["medrag*"]

[tool.setuptools.package-data]
medrag = ["kb_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "kb: needs the real KB .docx files (data/ is not committed); skipped when they are absent",
]
