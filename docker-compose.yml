# One command: `docker compose up`  (add -d to detach; --wait to block until healthy).
# Needs the KB .docx files in ./data (not in git) and an NVIDIA GPU (see ADR 0001).
# No NVIDIA GPU: `docker compose -f docker-compose.yml -f docker-compose.cpu.yml up` (slower).
#
# Start order: ollama (healthy) -> model-pull (downloads the LLM once into the
# named volume, then exits) and embedder-pull (puts the BGE-M3 files, ~2.3 GB, into the embed-models volume
# once, then exits) -> api (healthy only after both models are present, BGE-M3 is loaded and the search index
# is ready).
#
# Offline / flaky network, optional, both default to an empty folder (then everything is downloaded):
#   MEDRAG_WHEELS_DIR  folder with wheels (torch CPU, transformers, ...) used by the image build instead of downloading
#   MEDRAG_EMBED_SRC   folder with the BGE-M3 files (see README); copied into the embed-models volume, not downloaded

services:
  ollama:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  model-pull:
    image: ollama/ollama:0.40.15
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MEDRAG_LLM_MODEL: ${MEDRAG_LLM_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama show "$$MEDRAG_LLM_MODEL" >/dev/null 2>&1; then
          echo "model $$MEDRAG_LLM_MODEL already present, skipping download"
        else
          echo "downloading $$MEDRAG_LLM_MODEL (first run only)"
          ollama pull "$$MEDRAG_LLM_MODEL"
        fi
    restart: "no"

  embedder-pull:
    build: &api-build
      context: .
      additional_contexts:
        wheels: ${MEDRAG_WHEELS_DIR:-./docker/wheels-none}
    image: medrag-api
    command: ["python", "-m", "medrag.modelstore"]
    environment:
      MEDRAG_EMBED_SEED: /seed
    volumes:
      - embed-models:/models
      - ${MEDRAG_EMBED_SRC:-./docker/embed-seed-none}:/seed:ro
    restart: "no"

  api:
    build: *api-build
    image: medrag-api
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
      embedder-pull:
        condition: service_completed_successfully
    environment:
      MEDRAG_KB_DIR: /kb
      MEDRAG_LLM_BACKEND: ${MEDRAG_LLM_BACKEND:-ollama}
      MEDRAG_OLLAMA_URL: http://ollama:11434
      MEDRAG_LLM_MODEL: ${MEDRAG_LLM_MODEL:-qwen3.5:4b}
      # Optional hosted backend (off by default); values come from your shell or .env, never from this file.
      MEDRAG_OPENAI_BASE_URL: ${MEDRAG_OPENAI_BASE_URL:-}
      MEDRAG_OPENAI_MODEL: ${MEDRAG_OPENAI_MODEL:-}
      MEDRAG_OPENAI_API_KEY: ${MEDRAG_OPENAI_API_KEY:-}
      MEDRAG_BUDGET_S: ${MEDRAG_BUDGET_S:-25}
      MEDRAG_TOP_K: ${MEDRAG_TOP_K:-4}
      MEDRAG_OLLAMA_NUM_CTX: ${MEDRAG_OLLAMA_NUM_CTX:-8192}
      MEDRAG_MAX_MESSAGE_CHARS: ${MEDRAG_MAX_MESSAGE_CHARS:-2000}
      MEDRAG_LLM_CONCURRENCY: ${MEDRAG_LLM_CONCURRENCY:-1}
      MEDRAG_LLM_EST_S: ${MEDRAG_LLM_EST_S:-5}
      MEDRAG_MAX_OUTPUT_TOKENS: ${MEDRAG_MAX_OUTPUT_TOKENS:-1200}
      MEDRAG_MIN_OUTPUT_TOKENS: ${MEDRAG_MIN_OUTPUT_TOKENS:-150}
      MEDRAG_DECODE_TOK_S: ${MEDRAG_DECODE_TOK_S:-53}
      MEDRAG_LLM_MARGIN_S: ${MEDRAG_LLM_MARGIN_S:-2.5}
      MEDRAG_USAGE_HEADER: ${MEDRAG_USAGE_HEADER:-0}
      # Bearer token of the /admin endpoints, from your shell; unset = /admin answers 503. No value in this file.
      MEDRAG_ADMIN_TOKEN: ${MEDRAG_ADMIN_TOKEN:-}
      MEDRAG_RETRIEVER: ${MEDRAG_RETRIEVER:-hybrid}
      MEDRAG_MIN_DENSE: ${MEDRAG_MIN_DENSE:-0.5}
      MEDRAG_EMBED_THREADS: ${MEDRAG_EMBED_THREADS:-4}
    volumes:
      - ./data:/kb:ro
      - sessions:/var/lib/medrag  # Sessions (SQLite) survive restarts and rebuilds of the api
      - embed-models:/models:ro   # BGE-M3 files, put there once by embedder-pull
      - index:/index              # the search index, rebuilt only when a KB Document or the model changes
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60  # loading BGE-M3 and, the first time, embedding the 113 Sections takes about a minute on the CPU
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-models:
  sessions:
  embed-models:
  index:
